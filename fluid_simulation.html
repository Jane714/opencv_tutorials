<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Fluid Playground</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #111827, #020617);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-top: 24px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #e2e8f0;
      text-shadow: 0 6px 18px rgba(15, 23, 42, 0.65);
    }

    #container {
      display: flex;
      flex-direction: row;
      gap: 24px;
      width: clamp(320px, 90vw, 1100px);
      padding: 24px;
      box-sizing: border-box;
    }

    #controls {
      flex: 1 1 320px;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 20px 24px;
      box-shadow: 0 15px 40px rgba(2, 6, 23, 0.45);
      display: grid;
      gap: 18px;
      align-content: start;
    }

    #canvas-container {
      flex: 1 1 600px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(15, 23, 42, 0.45);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 15px 40px rgba(2, 6, 23, 0.45);
    }

    canvas {
      border-radius: 12px;
      background: #020617;
      box-shadow: inset 0 0 25px rgba(30, 64, 175, 0.4);
      cursor: crosshair;
    }

    .control {
      display: grid;
      gap: 6px;
    }

    label {
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #cbd5f5;
    }

    input[type="range"], select {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #facc15;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.45);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #facc15;
      cursor: pointer;
    }

    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(120deg, #3b82f6, #0ea5e9);
      color: #f8fafc;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 24px rgba(14, 165, 233, 0.35);
    }

    button.secondary {
      background: linear-gradient(120deg, #6366f1, #8b5cf6);
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.35);
    }

    button:hover {
      transform: translateY(-2px);
    }

    #legend {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.45;
    }

    .inline {
      display: flex;
      gap: 12px;
    }
  </style>
</head>
<body>
  <h1>Fluid Dynamics Playground</h1>
  <div id="container">
    <section id="controls">
      <div class="control">
        <label>Diffusion <span id="diffusionValue"></span></label>
        <input id="diffusion" type="range" min="0" max="0.0015" step="0.00005" value="0.0002">
      </div>
      <div class="control">
        <label>Viscosity <span id="viscosityValue"></span></label>
        <input id="viscosity" type="range" min="0" max="0.002" step="0.00005" value="0.0004">
      </div>
      <div class="control">
        <label>Time Step <span id="dtValue"></span></label>
        <input id="dt" type="range" min="0.01" max="0.08" step="0.005" value="0.03">
      </div>
      <div class="control">
        <label>Force Strength <span id="forceValue"></span></label>
        <input id="force" type="range" min="20" max="220" step="5" value="110">
      </div>
      <div class="control">
        <label>Density Injection <span id="densityValue"></span></label>
        <input id="density" type="range" min="5" max="70" step="1" value="30">
      </div>
      <div class="control">
        <label>Brush Radius <span id="brushValue"></span></label>
        <input id="brush" type="range" min="1" max="12" step="1" value="4">
      </div>
      <hr style="border: none; border-top: 1px solid rgba(148, 163, 184, 0.25);">
      <div class="control">
        <label>Obstacle Shape</label>
        <select id="shape">
          <option value="circle">Circle</option>
          <option value="square">Square</option>
        </select>
      </div>
      <div class="control">
        <label>Obstacle Size <span id="sizeValue"></span></label>
        <input id="size" type="range" min="4" max="22" step="1" value="12">
      </div>
      <div class="inline">
        <button id="clearFluid" class="secondary">Clear Fluid</button>
        <button id="clearObstacles">Clear Obstacles</button>
      </div>
      <p id="legend">
        Drag on the canvas to stir the fluid. Click to place obstacles while holding the <strong>O</strong> key.
        Obstacles interact with the simulation and redirect the flow.
      </p>
    </section>
    <div id="canvas-container">
      <canvas id="canvas" width="620" height="620"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const diffusionSlider = document.getElementById('diffusion');
    const viscositySlider = document.getElementById('viscosity');
    const dtSlider = document.getElementById('dt');
    const forceSlider = document.getElementById('force');
    const densitySlider = document.getElementById('density');
    const brushSlider = document.getElementById('brush');
    const shapeSelect = document.getElementById('shape');
    const sizeSlider = document.getElementById('size');

    const diffusionValue = document.getElementById('diffusionValue');
    const viscosityValue = document.getElementById('viscosityValue');
    const dtValue = document.getElementById('dtValue');
    const forceValue = document.getElementById('forceValue');
    const densityValue = document.getElementById('densityValue');
    const brushValue = document.getElementById('brushValue');
    const sizeValue = document.getElementById('sizeValue');

    const clearFluidButton = document.getElementById('clearFluid');
    const clearObstaclesButton = document.getElementById('clearObstacles');

    function updateLabels() {
      diffusionValue.textContent = diffusionSlider.value;
      viscosityValue.textContent = viscositySlider.value;
      dtValue.textContent = dtSlider.value;
      forceValue.textContent = forceSlider.value;
      densityValue.textContent = densitySlider.value;
      brushValue.textContent = brushSlider.value;
      sizeValue.textContent = sizeSlider.value;
    }

    updateLabels();
    [diffusionSlider, viscositySlider, dtSlider, forceSlider, densitySlider, brushSlider, sizeSlider].forEach(el => {
      el.addEventListener('input', updateLabels);
    });

    const N = 90;
    const iter = 4;

    const size = (N + 2) * (N + 2);
    const IX = (x, y) => x + (N + 2) * y;

    let dt = parseFloat(dtSlider.value);
    let diff = parseFloat(diffusionSlider.value);
    let visc = parseFloat(viscositySlider.value);

    let s = new Float32Array(size);
    let density = new Float32Array(size);

    let Vx = new Float32Array(size);
    let Vy = new Float32Array(size);

    let Vx0 = new Float32Array(size);
    let Vy0 = new Float32Array(size);

    const obstacleGrid = new Uint8Array(size);

    const cellWidth = canvas.width / (N + 2);
    const cellHeight = canvas.height / (N + 2);

    const keysPressed = new Set();

    window.addEventListener('keydown', (e) => keysPressed.add(e.key.toLowerCase()));
    window.addEventListener('keyup', (e) => keysPressed.delete(e.key.toLowerCase()));

    function clearFluid() {
      density.fill(0);
      Vx.fill(0);
      Vy.fill(0);
    }

    function clearObstacles() {
      obstacleGrid.fill(0);
    }

    clearFluidButton.addEventListener('click', clearFluid);
    clearObstaclesButton.addEventListener('click', clearObstacles);

    function addObstacle(x, y, radius, type) {
      for (let j = 1; j <= N; j++) {
        for (let i = 1; i <= N; i++) {
          const cx = (i + 0.5) * cellWidth;
          const cy = (j + 0.5) * cellHeight;
          const dx = cx - x;
          const dy = cy - y;
          let inside = false;
          if (type === 'circle') {
            inside = Math.hypot(dx, dy) <= radius;
          } else {
            inside = Math.abs(dx) <= radius && Math.abs(dy) <= radius;
          }
          if (inside) {
            obstacleGrid[IX(i, j)] = 1;
          }
        }
      }
    }

    function applyObstacles(field) {
      for (let j = 1; j <= N; j++) {
        for (let i = 1; i <= N; i++) {
          if (obstacleGrid[IX(i, j)]) {
            field[IX(i, j)] = 0;
          }
        }
      }
    }

    function isObstacle(i, j) {
      if (i < 1 || i > N || j < 1 || j > N) return false;
      return obstacleGrid[IX(i, j)] === 1;
    }

    function addSource(x, s, dt) {
      for (let i = 0; i < size; i++) {
        x[i] += dt * s[i];
      }
    }

    function set_bnd(b, x) {
      for (let i = 1; i <= N; i++) {
        x[IX(0, i)] = b === 1 ? -x[IX(1, i)] : x[IX(1, i)];
        x[IX(N + 1, i)] = b === 1 ? -x[IX(N, i)] : x[IX(N, i)];
        x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
        x[IX(i, N + 1)] = b === 2 ? -x[IX(i, N)] : x[IX(i, N)];
      }

      x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
      x[IX(0, N + 1)] = 0.5 * (x[IX(1, N + 1)] + x[IX(0, N)]);
      x[IX(N + 1, 0)] = 0.5 * (x[IX(N, 0)] + x[IX(N + 1, 1)]);
      x[IX(N + 1, N + 1)] = 0.5 * (x[IX(N, N + 1)] + x[IX(N + 1, N)]);

      for (let j = 1; j <= N; j++) {
        for (let i = 1; i <= N; i++) {
          if (!obstacleGrid[IX(i, j)]) continue;
          x[IX(i, j)] = 0;
          if (!obstacleGrid[IX(i - 1, j)]) x[IX(i - 1, j)] = b === 1 ? -x[IX(i - 1, j)] : x[IX(i - 1, j)];
          if (!obstacleGrid[IX(i + 1, j)]) x[IX(i + 1, j)] = b === 1 ? -x[IX(i + 1, j)] : x[IX(i + 1, j)];
          if (!obstacleGrid[IX(i, j - 1)]) x[IX(i, j - 1)] = b === 2 ? -x[IX(i, j - 1)] : x[IX(i, j - 1)];
          if (!obstacleGrid[IX(i, j + 1)]) x[IX(i, j + 1)] = b === 2 ? -x[IX(i, j + 1)] : x[IX(i, j + 1)];
        }
      }
    }

    function lin_solve(b, x, x0, a, c) {
      const cRecip = 1.0 / c;
      for (let k = 0; k < iter; k++) {
        for (let j = 1; j <= N; j++) {
          for (let i = 1; i <= N; i++) {
            if (isObstacle(i, j)) {
              x[IX(i, j)] = 0;
              continue;
            }
            x[IX(i, j)] = (x0[IX(i, j)] + a * (
              x[IX(i - 1, j)] + x[IX(i + 1, j)] +
              x[IX(i, j - 1)] + x[IX(i, j + 1)]
            )) * cRecip;
          }
        }
        set_bnd(b, x);
      }
    }

    function diffuse(b, x, x0, diff, dt) {
      const a = dt * diff * N * N;
      lin_solve(b, x, x0, a, 1 + 4 * a);
    }

    function advect(b, d, d0, velocX, velocY, dt) {
      const dt0 = dt * N;

      for (let j = 1; j <= N; j++) {
        for (let i = 1; i <= N; i++) {
          if (isObstacle(i, j)) {
            d[IX(i, j)] = 0;
            continue;
          }

          let x = i - dt0 * velocX[IX(i, j)];
          let y = j - dt0 * velocY[IX(i, j)];

          if (x < 0.5) x = 0.5;
          if (x > N + 0.5) x = N + 0.5;
          const i0 = Math.floor(x);
          const i1 = i0 + 1;

          if (y < 0.5) y = 0.5;
          if (y > N + 0.5) y = N + 0.5;
          const j0 = Math.floor(y);
          const j1 = j0 + 1;

          const s1 = x - i0;
          const s0 = 1 - s1;
          const t1 = y - j0;
          const t0 = 1 - t1;

          d[IX(i, j)] =
            s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
            s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
        }
      }
      set_bnd(b, d);
    }

    function project(velocX, velocY, p, div) {
      for (let j = 1; j <= N; j++) {
        for (let i = 1; i <= N; i++) {
          if (isObstacle(i, j)) {
            div[IX(i, j)] = 0;
            p[IX(i, j)] = 0;
            continue;
          }
          div[IX(i, j)] = -0.5 * (
            velocX[IX(i + 1, j)] - velocX[IX(i - 1, j)] +
            velocY[IX(i, j + 1)] - velocY[IX(i, j - 1)]
          ) / N;
          p[IX(i, j)] = 0;
        }
      }
      set_bnd(0, div);
      set_bnd(0, p);

      lin_solve(0, p, div, 1, 4);

      for (let j = 1; j <= N; j++) {
        for (let i = 1; i <= N; i++) {
          if (isObstacle(i, j)) {
            velocX[IX(i, j)] = 0;
            velocY[IX(i, j)] = 0;
            continue;
          }
          velocX[IX(i, j)] -= 0.5 * (p[IX(i + 1, j)] - p[IX(i - 1, j)]) * N;
          velocY[IX(i, j)] -= 0.5 * (p[IX(i, j + 1)] - p[IX(i, j - 1)]) * N;
        }
      }
      set_bnd(1, velocX);
      set_bnd(2, velocY);
    }

    function dens_step(x, x0, velocX, velocY, diff, dt) {
      addSource(x, x0, dt);
      [x0, x] = [x, x0];
      diffuse(0, x, x0, diff, dt);
      [x0, x] = [x, x0];
      advect(0, x, x0, velocX, velocY, dt);
      applyObstacles(x);
    }

    function vel_step(velocX, velocY, velocX0, velocY0, visc, dt) {
      addSource(velocX, velocX0, dt);
      addSource(velocY, velocY0, dt);

      [velocX0, velocX] = [velocX, velocX0];
      diffuse(1, velocX, velocX0, visc, dt);
      [velocY0, velocY] = [velocY, velocY0];
      diffuse(2, velocY, velocY0, visc, dt);

      project(velocX, velocY, velocX0, velocY0);

      [velocX0, velocX] = [velocX, velocX0];
      [velocY0, velocY] = [velocY, velocY0];

      advect(1, velocX, velocX0, velocX0, velocY0, dt);
      advect(2, velocY, velocY0, velocX0, velocY0, dt);

      project(velocX, velocY, velocX0, velocY0);
      applyObstacles(velocX);
      applyObstacles(velocY);
    }

    let mouseDown = false;
    let lastX = 0;
    let lastY = 0;

    canvas.addEventListener('mousedown', (e) => {
      mouseDown = true;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      handleInteraction(x, y, true);
      lastX = x;
      lastY = y;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!mouseDown) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      handleInteraction(x, y, false);
      lastX = x;
      lastY = y;
    });

    window.addEventListener('mouseup', () => {
      mouseDown = false;
    });

    function handleInteraction(x, y, first) {
      const brush = parseInt(brushSlider.value, 10);
      const densityAmount = parseFloat(densitySlider.value);
      const forceAmount = parseFloat(forceSlider.value);
      const createObstacle = keysPressed.has('o');
      const radius = parseInt(sizeSlider.value, 10) * cellWidth;
      const shape = shapeSelect.value;

      const i = Math.floor((x / canvas.width) * (N + 2));
      const j = Math.floor((y / canvas.height) * (N + 2));

      if (createObstacle) {
        addObstacle(x, y, radius, shape);
        return;
      }

      for (let dy = -brush; dy <= brush; dy++) {
        for (let dx = -brush; dx <= brush; dx++) {
          const ii = i + dx;
          const jj = j + dy;
          if (ii < 1 || ii > N || jj < 1 || jj > N) continue;
          if (Math.hypot(dx, dy) > brush) continue;
          if (isObstacle(ii, jj)) continue;

          density[IX(ii, jj)] += densityAmount;
          const fx = (x - lastX) * forceAmount * 0.0015;
          const fy = (y - lastY) * forceAmount * 0.0015;
          Vx[IX(ii, jj)] += fx;
          Vy[IX(ii, jj)] += fy;
        }
      }
    }

    function renderDensities(dens) {
      const imageData = ctx.createImageData(canvas.width, canvas.height);
      const data = imageData.data;
      const cw = canvas.width / (N + 2);
      const ch = canvas.height / (N + 2);

      for (let j = 0; j < canvas.height; j++) {
        for (let i = 0; i < canvas.width; i++) {
          const cellX = Math.floor(i / cw);
          const cellY = Math.floor(j / ch);
          const idx = IX(cellX, cellY);
          let value = dens[idx];
          if (obstacleGrid[idx]) {
            value = 0;
          }
          const color = Math.min(255, value * 2);
          const index = (i + j * canvas.width) * 4;
          data[index] = color * 0.6;
          data[index + 1] = color;
          data[index + 2] = 255;
          data[index + 3] = Math.min(255, 30 + color);
        }
      }

      ctx.putImageData(imageData, 0, 0);

      ctx.save();
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.6)';
      ctx.lineWidth = 1.5;
      obstacleGrid.forEach((value, index) => {
        if (!value) return;
        const x = index % (N + 2);
        const y = Math.floor(index / (N + 2));
        ctx.fillStyle = 'rgba(148, 163, 184, 0.35)';
        ctx.fillRect(x * cw, y * ch, cw, ch);
      });
      ctx.restore();
    }

    function step() {
      dt = parseFloat(dtSlider.value);
      diff = parseFloat(diffusionSlider.value);
      visc = parseFloat(viscositySlider.value);

      vel_step(Vx, Vy, Vx0, Vy0, visc, dt);
      dens_step(density, s, Vx, Vy, diff, dt);

      Vx0.fill(0);
      Vy0.fill(0);
      s.fill(0);

      renderDensities(density);
      requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
  </script>
</body>
</html>
